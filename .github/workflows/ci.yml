name: CI

on:
  push:
    branches: [main]
  pull_request:

# Public repository: GitHub-hosted runners only. A fork's pull request must
# never execute on our own hardware.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - run: bun install --frozen-lockfile

      # Named separately so a red build says which contract broke, rather than
      # pointing at the one script that runs all of them.
      - name: Spec matches the grammar
        run: bun run spec:check

      - name: Tests, including the conformance suite
        run: bun test

      - name: Typecheck
        run: bun run typecheck

      - name: Build the published output
        run: bun run build

      # alpha.1 published a `bin` pointing at TypeScript, so every install got
      # a node_modules/.bin link Node refused to run. This asserts the built
      # target exists, is .js, and carries the node shebang.
      - name: Every bin target is node-executable
        run: bun scripts/check-bin.ts
