name: Publish

on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          # Never cache a release build.
          package-manager-cache: false

      # Trusted publishing needs npm 11.5.1 or newer, and the npm bundled with
      # a given Node 24 patch can be older than that.
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@^11.5.1

      - run: bun install --frozen-lockfile
      - run: bun run check

      # No NODE_AUTH_TOKEN and no npm token secret: the OIDC token minted by
      # id-token:write authenticates the publish, and npm attaches provenance.
      #
      # `latest` is passed explicitly rather than left to npm's default. npm
      # refuses to publish a prerelease under the default tag (publish.js
      # checks `isDefaultTag`), and moving a dist-tag after the fact needs an
      # interactive 2FA code. Publishing straight to `latest` keeps a bare
      # `npm install` on the newest release with no manual step.
      - name: Publish to npm
        run: npm publish --tag latest --access public

      # Best effort: the OIDC token authenticates `npm publish`, not dist-tag
      # writes. When the registry refuses it, `latest` is already correct and
      # only the `@alpha` alias lags.
      - name: Point the alpha tag at this release
        run: |
          PKG=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          npm dist-tag add "$PKG@$VERSION" alpha \
            || echo "alpha tag not set (needs account auth); latest is correct"
